services:
  geekdesign:
    image: ghcr.io/leskur/geek-design:latest
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${GEEKDESIGN_BIND:-0.0.0.0}:${GEEKDESIGN_PORT:-5174}:5174"
    environment:
      SKETCHPEEK_PUBLIC_ORIGIN: "${SKETCHPEEK_PUBLIC_ORIGIN:-}"
      SKETCHPEEK_MAX_FILE_SIZE: "${SKETCHPEEK_MAX_FILE_SIZE:-}"
      SKETCHPEEK_MAX_JSON_SIZE: "${SKETCHPEEK_MAX_JSON_SIZE:-}"
    volumes:
      - geekdesign-data:/app/data
    stop_grace_period: 30s

volumes:
  geekdesign-data:
