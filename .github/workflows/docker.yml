name: Docker deployment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.env.example'
      - 'scripts/smoke-docker.mjs'
      - 'scripts/build-server.mjs'
      - 'server/**'
      - 'shared/**'
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci
      - run: docker compose -p geekdesign-ci up -d --build --wait --wait-timeout 120
      - run: npm run smoke:docker -- http://127.0.0.1:5174
      - name: Recreate container and verify persisted account data
        run: |
          docker compose -p geekdesign-ci down
          docker compose -p geekdesign-ci up -d --no-build --wait --wait-timeout 120
          docker compose -p geekdesign-ci exec -T geekdesign node --input-type=module -e "import Database from 'better-sqlite3';const db=new Database('/app/data/metadata.sqlite',{readonly:true});if(db.prepare('SELECT COUNT(*) AS n FROM users').get().n!==1)process.exit(1);db.close();"
      - if: failure()
        run: docker compose -p geekdesign-ci logs --tail 100
      - if: always()
        run: docker compose -p geekdesign-ci down --volumes
