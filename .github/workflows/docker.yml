name: Docker deployment

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - '.env.example'
      - 'scripts/build-server.mjs'
      - 'server/**'
      - 'shared/**'
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/docker.yml'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p geekdesign-ci up -d --build --wait --wait-timeout 120
      - name: Recreate container and check service
        run: |
          docker compose -p geekdesign-ci down
          docker compose -p geekdesign-ci up -d --no-build --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:5174/api/status
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/geek-design"
          version="${GITHUB_REF_NAME#v}"
          docker tag "$image:latest" "$image:$version"
          docker push "$image:latest"
          docker push "$image:$version"
      - if: failure()
        run: docker compose -p geekdesign-ci logs --tail 100
      - if: always()
        run: docker compose -p geekdesign-ci down --volumes
