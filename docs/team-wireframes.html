function uploadPermission(){return state.role==='designer'?'':'disabled title="演示：开发者没有上传权限"'}
function head(title,sub,action=''){return `<div class="screen-head"><div><h2>${title}</h2><p>${sub}</p></div>${action}</div>`}
function board(name,selected=false){return `<div class="artboard ${selected?'selected':''}" data-name="${name}"><div class="phone-bar"><span>9:41</span><span>••• ▰</span></div><header>开票</header><div class="steps"><span>填写信息</span><span>主办方处理</span><span>已拒绝</span></div><div class="amount">开票金额：￥1000.00</div><div class="block"><b>拒绝原因</b><div class="lines"><span>请核对纳税人识别号</span></div></div><div class="block"><b>开票信息</b><div class="lines"><span><i>发票类型</i>增值税普通发票</span><span><i>发票内容</i>活动报名费</span><span><i>发票抬头</i>示例公司</span><span><i>手机号</i>示例联系方式</span><span><i>领取方式</i>快递邮寄</span></div></div><div class="callout">联系主办方　›</div><div class="bottom"><p>设计内容示意，非实际渲染</p><span>重新申请</span></div></div>`}
const screens={
projects:{label:'文档',body:()=>`${head('项目文档','设计师上传，开发者通过同一个项目空间查看。',`<button class="primary" data-screen="upload" ${uploadPermission()}>＋ 上传 Sketch</button>`)}<div class="stats"><div><strong>2</strong>示例文档</div><div><strong>1</strong>正在处理</div><div><strong>本地</strong>部署方式</div></div><div class="list-toolbar"><span>全部文档</span><input class="search" aria-label="搜索文档（演示）" placeholder="搜索文档…" id="doc-search"></div><div class="document-card" data-document="活动平台 fu-h5"><div class="mini-cover"><i></i><i></i><i></i></div><div class="card-copy"><h3>活动平台 · 界面设计</h3><p><span class="file">fu-h5.sketch</span><br>当前稿 ${state.current} · 8 页 · 343 个画板<br>设计师上传 · 演示记录</p></div><div><span class="badge green">可查看</span><button class="text-link" data-screen="viewer">打开文档 →</button></div></div><div class="document-card" data-document="组件库"><div class="mini-cover pc"><i></i></div><div class="card-copy"><h3>公共组件库</h3><p>演示文档<br>首次上传已完成，正在建立索引</p></div><div><span class="badge amber">处理中</span><button class="text-link" data-screen="upload">查看进度 →</button></div></div><div class="banner"><strong>${state.upload==='ready'?'新稿 r3 已就绪':state.upload==='failed'?'新稿处理失败，当前稿继续可用':'已有新稿正在处理'}</strong><br>${state.upload==='ready'?'当前稿入口已更新到 r3。正在查看旧稿的开发者仍留在原稿，可自行切换。':'当前可查看的稿件继续可用。新稿就绪后再提示团队切换。'}</div>`,notes:()=>notes('入口围绕项目组织','同一个文档持续更新，团队不再通过聊天反复传原文件。',[
['设计师的入口','新文档用“上传 Sketch”；已有文档进入上传记录，选择“上传新稿”。'],['开发者的入口','从文档卡片或固定链接进入。首次打开之后，就绑定到明确的一次上传。'],['项目成员能力','右上角可以切换演示角色。实际权限在后端执行，隐藏按钮不等于权限控制。']
],'第一阶段只做本地账号和项目授权，不需要组织架构或复杂审批。')},
upload:{label:'上传设计稿',body:()=>{
 const u=state.upload,labels={uploading:'传输中',processing:'处理中',failed:'处理失败',ready:'可查看'};
 return `${head('上传设计稿','更新到原文档，保留旧稿和原有链接。')}<div class="two-columns"><section class="panel"><h3>目标文档</h3><div class="field"><label>项目</label><div class="field-value">活动平台</div></div><div class="field"><label>文档</label><div class="field-value">活动平台 · 界面设计<small>上传新稿</small></div></div><div class="upload-drop"><div class="file-icon">◇</div><h4>fu-h5.sketch</h4><p>486 MiB · 示例文件<br>演示状态，不会从此草图读取或上传文件</p></div><div class="field"><label>更新说明（可选）</label><div class="field-value">调整开票流程与页面样式</div></div><div class="progress"><span style="width:${u==='uploading'?'68':'100'}%"></span></div><div class="progress-caption"><span>${u==='uploading'?'已接收 331 / 486 MiB':'文件接收完成'}</span><span>${labels[u]}</span></div><p class="small-note">上传完成后可以关闭页面。文件解析由后台继续处理。</p></section><section><div class="state-switch" aria-label="切换演示状态">${Object.entries(labels).map(([k,v])=>`<button data-upload="${k}" class="${u===k?'active':''}">${v}</button>`).join('')}</div><div class="panel"><h3>${labels[u]} <span class="badge gray">模拟状态</span></h3><div class="timeline"><div class="${u==='uploading'?'current':'done'}"><b>传输原文件</b><p>${u==='uploading'?'可暂停，网络恢复后继续已确认的进度。':'文件已完整接收，大小与完整性校验通过。'}</p></div><div class="${u==='processing'||u==='failed'?'current':u==='ready'?'done':''}"><b>解析页面与组件</b><p>${u==='failed'?'某个页面数据无法解析。原文件已保留，无需重新上传。':u==='uploading'?'等待文件接收完成。':'逐页读取文档结构，建立组件与资源对应关系。'}</p></div><div class="${u==='ready'?'done':''}"><b>可供团队查看</b><p>${u==='ready'?'上传记录 r3 已就绪。可以查看，或设为当前稿。':'处理完成前，团队继续使用当前稿 r2。'}</p></div></div><div class="actions">${u==='failed'?`<button class="primary" data-action="retry" ${uploadPermission()}>重新解析（演示）</button>`:u==='ready'?'<button class="primary" data-screen="revisions">查看上传记录 →</button>':u==='uploading'?`<button data-action="pause" ${uploadPermission()}>暂停 / 继续（演示）</button>`:'<button data-screen="projects">返回项目</button>'}</div></div></section></div>`;
 },notes:()=>notes('分清“传完”和“可用”','传输显示字节进度，解析显示真实步骤。解析失败时可以直接重试。',[
 ['大文件可靠传输','针对现有 486 MiB 样本，先做断点续传和完整性校验。刷新后可重新选择同一文件继续。'],['任务与浏览器分离','文件接收完成后，关闭标签页不影响后台解析。失败任务保留原文件。'],['新稿不打断当前工作','失败与处理中记录不覆盖当前可用稿；并发新稿冲突时，需要明确选择当前稿。']
 ],'上方状态按钮只用于评审异常流程，不会产生上传任务。')},
revisions:{label:'上传记录',body:()=>`${head('文档与上传记录','活动平台 · 界面设计',`<button class="primary" data-screen="upload" ${uploadPermission()}>＋ 上传新稿</button>`)}<div class="banner"><strong>当前稿：${state.current}</strong>　可查看<br>固定记录链接始终指向同一次上传；“当前稿”入口随确认后的新稿更新。</div><div class="record"><div class="record-number">r3</div><div><h3>调整开票流程与页面样式</h3><p>设计师 · 新上传的演示记录<br>${state.upload==='ready'?'已处理完成，并成为当前稿。':state.upload==='failed'?'解析失败，原文件已保留。':state.upload==='uploading'?'原文件正在传输，可暂停和续传。':'原文件已保存，正在解析页面。'}</p></div><div class="record-actions"><span class="badge ${state.upload==='ready'?'green':'amber'}">${state.upload==='ready'?'当前稿':state.upload==='failed'?'处理失败':state.upload==='uploading'?'传输中':'处理中'}</span>${state.upload==='ready'?'<button data-revision="r3">打开固定记录</button>':'<button data-screen="upload">查看任务</button>'}</div></div><div class="record"><div class="record-number">r2</div><div><h3>活动平台界面更新</h3><p>设计师 · 演示记录<br>8 页 · 343 个画板 · ${state.current==='r2'?'当前使用中的稿件':'历史内容继续保留'}</p></div><div class="record-actions"><span class="badge ${state.current==='r2'?'green':'gray'}">${state.current==='r2'?'当前稿':'历史稿'}</span><button data-revision="r2">打开固定记录</button></div></div><div class="record"><div class="record-number">r1</div><div><h3>首次上传</h3><p>设计师 · 演示记录<br>历史内容保留，旧链接继续可访问。</p></div><div class="record-actions"><span class="badge gray">历史稿</span><button data-revision="r1">查看历史稿</button></div></div><p class="small-note">并发上传若遇到当前稿变化，显示“待确认”，由有上传权限的成员选择是否设为当前稿。草图中的 r1 / r2 / r3 为虚构记录。</p>`,notes:()=>notes('旧链接要有稳定含义','第一阶段先保存独立上传记录，不必马上做完整的版本对比系统。',[
 ['文档与上传记录分开','文档是持续更新的容器；记录保存原文件、处理结果和资源对应关系。'],['进入查看器后固定','开发者正在查看 r2 时，新稿完成只显示提示，不强制跳到 r3。'],['失败稿与并发稿','失败记录可重试；新上传就绪但与当前稿发生冲突时，保留“待确认”，不按完成时间盲目覆盖。']
 ],'默认设计师可以设定当前稿，开发者只能查看与导出。')},
viewer:{label:'查看与检查',body:()=>`<div class="viewer-wrap"><div class="viewer-top"><span>活动平台 / 界面设计 <span class="badge ${state.revision===state.current?'green':'gray'}">${state.revision===state.current?'当前稿':'历史稿'} ${state.revision}</span></span><button data-action="link">固定链接规则 ↗</button></div><div class="viewer-body"><aside class="viewer-nav"><div class="page-select">UI(H5) <span>179⌄</span></div><p>画板　/　图层</p><div class="board-item">申请开票-填写信息<small>414 × 1352</small></div><div class="board-item current">✓ 申请开票-拒绝<small>414 × 1004</small></div><div class="board-item">✓ 申请开票-主办方处理<small>414 × 951</small></div><div class="board-item">申请开票-开票完成<small>414 × 951</small></div><p class="small-note">切换 Page 保留<br>待导出的画板</p></aside><div class="stage ${state.mode==='inspection'?'inspection':''}"><div class="stage-toolbar"><div class="segmented"><button data-mode="overview" class="${state.mode==='overview'?'active':''}">页面总览</button><button data-mode="inspection" class="${state.mode==='inspection'?'active':''}">单画板检查</button></div><span class="zoom-note">${state.mode==='overview'?'总览示意':'检查示意'}</span></div><div class="boards-world">${board('申请开票-填写信息')}${board('申请开票-拒绝',true)}${board('申请开票-主办方处理')}</div><div class="basket"><span>已选 2 个画板</span><button class="primary" data-screen="export">导出给 AI →</button></div></div><aside class="viewer-inspect"><h4>属性检查</h4><span class="badge">text</span><h4 style="margin-top:16px">开票信息</h4><div class="prop"><span>尺寸</span><b>64 × 22</b></div><div class="prop"><span>字体</span><b>PingFang SC</b></div><div class="prop"><span>字号</span><b>16 px</b></div><div class="prop"><span>颜色</span><b>#333333</b></div><div class="code">width: 64px;<br>height: 22px;<br>font-size: 16px;</div><p class="small-note">缺失字体可从本机加载。预览可能与原稿有差异。</p></aside></div><div class="viewer-footer"><span>固定上传记录 · 按需加载</span><span>空格拖动 · Alt 测距 · Ctrl 点选内部</span></div></div>`,notes:()=>notes('把现有查看器接进团队流程','保留已经形成的使用习惯，补上项目来源、固定记录和待导出列表。',[
 ['总览与检查各有用途','总览用于找画板、对比状态；检查用于图层与标注。返回总览恢复原来的位置。'],['只加载需要的内容','开发者按需读取页面、组件与图片，不先下载整份 Sketch。大页面后续再按画板细分。'],['预览与事实分开','字体、复杂效果等兼容问题需要明确标记。数据正确不等于画面已经逐像素还原。']
 ],'画布中的设计是示意绘制，不是新实现的渲染功能。顶部可切换两种查看草图。')},
export:{label:'AI 交付导出',body:()=>`${head('导出给 AI','把选中的设计、结构和资源一起交付。')}<div class="export-selection"><div><strong>活动平台 · 界面设计 / ${state.revision}</strong><span>申请开票-拒绝、申请开票-主办方处理</span></div><span class="badge">2 个画板</span></div><div class="export-grid"><section class="panel"><h3>交付内容</h3><div class="export-option"><span class="check">✓</span><div><b>HTML 预览与参考图</b><p>解压后可离线打开，供 AI 与开发者对照。</p></div></div><div class="export-option"><span class="check">✓</span><div><b>图层、文字、样式与组件关系</b><p>保留源图层 ID 与实例路径，帮助理解结构。</p></div></div><div class="export-option"><span class="check">✓</span><div><b>图片、SVG 图标与资源对应表</b><p>只包含所选画板使用的资源，共用资源只存一份。</p></div></div><div class="export-option"><span class="check">✓</span><div><b>AI 阅读说明与兼容问题</b><p>注明固定记录、缺失字体、近似效果与资源问题。</p></div></div></section><section><pre class="package-tree">sketchpeek-activity-${state.revision}/
├─ index.html
├─ README.md
├─ manifest.json
├─ design.json
├─ assets.json
├─ issues.json
├─ previews/
└─ assets/</pre><div class="issue"><span>△</span><div>示例预检：存在缺失字体和近似效果<p>可以带问题清单导出，不显示为“全部准确”。</p></div></div><div class="actions"><button class="primary" data-action="export">生成交付包（演示）</button></div><p class="small-note">第一阶段在浏览器生成 ZIP。此草图不生成或下载文件。</p></section></div><div class="banner"><strong>设计数据用于帮助 AI 理解，不替代页面布局设计。</strong><br>AI 结合目标项目重建响应式布局；参考图与 JSON 都绑定到同一份稿件。</div>`,notes:()=>notes('围绕你交给 AI 的习惯设计','默认交付整个文件夹的 ZIP，其中保留可直接打开的 HTML 入口。',[
 ['离线可读','HTML 内嵌查看所需的轻量脚本与索引，不依赖内部 API、CDN或登录会话。'],['资源有明确对应关系','照片保留原格式；受支持的图标导出 SVG；近似 PNG 标记来源与限制，不把降级结果冒充精确切图。'],['导出前看清问题','列出所选范围、资源体积与兼容项。导出过大时支持取消和缩小选择，不让浏览器长时间无响应。']
 ],'用真实交付包交给 AI 实现一个页面，是第一阶段最后一项验收。')}
};
function render(){const view=screens[state.screen];$('#screen').innerHTML=view.body();$('#notes').innerHTML=view.notes();$('#screen-label').textContent=view.label;document.querySelectorAll('[data-screen]').forEach(b=>{const active=b.dataset.screen===state.screen;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});document.querySelectorAll('[data-role]').forEach(b=>{const active=b.dataset.role===state.role;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});}
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button||button.disabled)return;const d=button.dataset;if(d.screen&&screens[d.screen]){state.screen=d.screen;if(d.screen==='viewer')state.revision=state.current;location.hash=d.screen;render()}else if(d.role){state.role=d.role;render()}else if(d.upload){state.upload=d.upload;state.current=d.upload==='ready'?'r3':'r2';render()}else if(d.mode){state.mode=d.mode;render()}else if(d.revision){state.revision=d.revision;state.screen='viewer';location.hash='viewer';render()}else if(d.action==='retry'){state.upload='processing';render();notice('演示：使用已保存原文件重新解析，无需重新传输。')}else if(d.action==='pause')notice('演示：实际开发时会暂停传输，恢复前向服务器查询已接收位置。');else if(d.action==='link')notice(`链接示意：/documents/demo/revisions/${state.revision}?page=demo&artboard=demo（未提供实际服务）`);else if(d.action==='export')notice('这是流程草图。正式实现后会预检所选资源，并在浏览器生成可离线使用的 ZIP。');});
document.addEventListener('input',e=>{if(e.target.id==='doc-search'){const value=e.target.value.toLocaleLowerCase();document.querySelectorAll('[data-document]').forEach(card=>card.hidden=!card.dataset.document.toLocaleLowerCase().includes(value));}});
window.addEventListener('hashchange',()=>{const name=location.hash.slice(1);if(Object.hasOwn(screens,name)&&name!==state.screen){state.screen=name;render()}});
const initial=location.hash.slice(1);if(Object.hasOwn(screens,initial))state.screen=initial;render();
</script>
</body>
</html>
